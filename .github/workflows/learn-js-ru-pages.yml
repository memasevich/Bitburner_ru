name: Publish Russian JavaScript lessons

on:
  push:
    branches: [main]
    paths:
      - 'learn-js-ru/**'
      - '.github/workflows/learn-js-ru-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: learn-js-ru
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
